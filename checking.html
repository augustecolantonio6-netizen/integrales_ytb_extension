<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Vérification de la vidéo</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at top, #1d2231 0%, #0b0c10 52%, #07080b 100%); color: #f7f8fb; padding: 24px; }
    main { width: min(480px, 100%); text-align: center; }
    .mark { width: 72px; height: 72px; margin: 0 auto 26px; border-radius: 22px; display: grid; place-items: center; border: 1px solid #363d50; background: #171b26; box-shadow: 0 14px 48px #0006; color: #b9c7ff; font-size: 32px; font-weight: 650; }
    .spinner { width: 22px; height: 22px; display: inline-block; border: 2px solid #485069; border-top-color: #b9c7ff; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -5px; margin-right: 9px; }
    h1 { font-size: clamp(23px, 4vw, 30px); letter-spacing: -.035em; margin: 0 0 12px; }
    p { margin: 0; color: #aeb4c5; line-height: 1.65; }
    #status { margin-top: 24px; color: #d6d9e3; font-size: 14px; overflow-wrap: anywhere; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">✓</div>
    <h1>Vérification de la vidéo</h1>
    <p>Gemini vérifie si le sujet est lié à l’une de tes matières autorisées. Si la vidéo est pertinente, elle s’ouvrira directement.</p>
    <p id="status"><span class="spinner" aria-hidden="true"></span>Analyse en cours…</p>
  </main>
  <script src="checking.js"></script>
</body>
</html>
