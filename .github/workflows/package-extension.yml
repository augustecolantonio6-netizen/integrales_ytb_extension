name: Package extension ZIP

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/package-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate and package extension
        shell: bash
        run: |
          set -euo pipefail
          for file in extension/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("extension/manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("manifest_version") == 3
          assert manifest.get("version") == "1.0.4"
          for required in ("background.js", "blocked.js", "content.js", "settings.js"):
              assert Path("extension", required).is_file(), required
          exercises = list(Path("extension/assets/exercises").glob("*.png"))
          solutions = list(Path("extension/assets/solutions").glob("*.png"))
          assert len(exercises) == 100, f"Expected 100 exercise PNGs, got {len(exercises)}"
          assert len(solutions) == 100, f"Expected 100 solution PNGs, got {len(solutions)}"
          print("Manifest and 200 exercise/solution images verified.")
          PY
          mkdir -p releases
          rm -f releases/Integrales_YouTube_Focus_v1.0.4.zip
          (cd extension && zip -qr ../releases/Integrales_YouTube_Focus_v1.0.4.zip . -x ".gitignore")
      - name: Commit packaged ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Integrales_YouTube_Focus_v1.0.4.zip
          if git diff --cached --quiet; then
            echo "ZIP is already up to date."
            exit 0
          fi
          git commit -m "Package extension v1.0.4"
          git push
